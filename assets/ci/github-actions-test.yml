name: test

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: python -m py_compile scripts/*.py
      - run: python -m unittest discover -s tests -v
      - run: node --check scripts/build_pptx.cjs
      - run: node --check scripts/images_to_pptx.cjs
      - run: node --check scripts/reconstruct_pptx.cjs
      - run: node --check scripts/html_export.cjs
      - run: |
          python scripts/init_deck.py /tmp/ppt-gen-ci --title "CI deck"
          node scripts/build_pptx.cjs /tmp/ppt-gen-ci /tmp/ppt-gen-ci/output/deck.pptx
          python scripts/pptx_check.py /tmp/ppt-gen-ci/output/deck.pptx --strict
